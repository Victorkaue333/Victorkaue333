name: Profile assets

# Gera o heatmap de contribuições (scripts/heatmap.py), o card de atividade (scripts/activity.py)
# e os cards de estatísticas (github-readme-stats) e publica tudo na branch `output`.
# O README referencia os arquivos via raw.githubusercontent.com/.../output/.

on:
  schedule:
    - cron: "23 3 * * *" # diário, 03:23 UTC (fora do horário cheio, que congestiona)
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Parte da publicação anterior: se um card falhar hoje, o de ontem continua no ar.
      - name: Restore previous output
        uses: actions/checkout@v6
        continue-on-error: true
        with:
          ref: output
          path: dist

      - name: Clean restored checkout
        run: rm -rf dist/.git

      - name: Contribution heatmap
        continue-on-error: true
        run: python3 scripts/heatmap.py dist/github-heatmap.svg dist/github-heatmap-dark.svg
        env:
          GITHUB_LOGIN: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Activity card
        continue-on-error: true
        run: python3 scripts/activity.py dist/github-activity.svg
        env:
          GITHUB_LOGIN: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&rank_icon=github&locale=pt-br&bg_color=050505&title_color=ff7a00&text_color=cccccc&icon_color=ff7a00&ring_color=ff7a00&border_radius=10&card_width=450
          path: dist/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&locale=pt-br&bg_color=050505&title_color=ff7a00&text_color=cccccc&border_radius=10&card_width=350&size_weight=0.5&count_weight=0.5
          path: dist/github-top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
